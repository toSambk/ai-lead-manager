spring:
  application:
    name: ai-lead-manager
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ai_lead_manager}
    username: ${POSTGRES_USER:ai_lead_manager}
    password: ${POSTGRES_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  session:
    jdbc:
      initialize-schema: never
server:
  servlet:
    session:
      timeout: 2h
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax
